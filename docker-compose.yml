# Two ways to use this file:
#
#   Development (run backend/AI/frontend yourself, only MongoDB in Docker):
#       docker compose up -d mongo
#
#   Everything in Docker (needs JWT_SECRET in .env):
#       docker compose --profile app up --build -d
#       docker compose --profile app run --rm backend npm run seed     # demo data
#       open http://localhost:8080
#
services:
  mongo:
    image: mongo:7
    container_name: eldercare-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"      # only reachable from this computer
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-service:
    profiles: ["app"]
    build: ./ai-service
    restart: unless-stopped
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5-5}
      AI_INTERNAL_KEY: ${AI_INTERNAL_KEY:-dev-internal-key-change-me}
    # No published port: only the backend can reach it.

  backend:
    profiles: ["app"]
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: "5000"
      MONGODB_URI: mongodb://mongo:27017/eldercare
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file (a long random string)}
      AI_SERVICE_URL: http://ai-service:8000
      AI_INTERNAL_KEY: ${AI_INTERNAL_KEY:-dev-internal-key-change-me}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Kolkata}
    # No published port: the website reaches it through nginx at /api.

  frontend:
    profiles: ["app"]
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mongo-data:
